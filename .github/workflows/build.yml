name: Build VOID OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Check repository
        run: |
          echo "===== Repository files ====="
          ls -la
          echo "===== ZIP files ====="
          find . -maxdepth 4 -type f -name '*.zip'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 4 -type f \
            -name 'void_os_android_project.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 找不到 void_os_android_project.zip"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          echo "===== Extracted files ====="
          find source -maxdepth 5 -type f | sort | head -200

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          ROOT=""

          WRAPPER="$(find source -type f -name gradlew -print -quit)"

          if [ -n "$WRAPPER" ]; then
            ROOT="$(dirname "$WRAPPER")"
          else
            SETTINGS="$(find source -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) -print -quit)"

            if [ -n "$SETTINGS" ]; then
              ROOT="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: ZIP 中没有找到 gradlew 或 settings.gradle"
            echo "请检查 ZIP 内是否包含完整 Android 项目。"
            exit 1
          fi

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "项目路径：$ROOT"

      - name: Build APK
        shell: bash
        run: |
          ROOT="${{ steps.locate.outputs.project_root }}"
          cd "$ROOT"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            gradle --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VOID-OS-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
